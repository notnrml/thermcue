# Fly.io deployment for the ThermCue engine.
#
# Region is chosen for latency to the judges rather than to the venue: the
# venue is a coordinate in a request body, the judges are the ones waiting for
# a page to paint.

app = "thermcue-engine"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  THERMCUE_CORS_ORIGINS = "*"
  # The background agent loop shares one tokens-per-minute budget with every
  # triggered request, and on a free tier that budget is 8,000. At the 120 s
  # default the loop alone consumed it and the demo trigger came back 429 with
  # nothing published. Fifteen minutes is plenty for an event that runs in hours,
  # and it leaves the budget for the thing a judge actually clicks.
  THERMCUE_AGENT_TICK_SECONDS = "900"

[http_service]
  internal_port = 8000
  force_https = true
  # Never scale to zero. A judge opening a cold link waits through a container
  # start plus a full thermal pipeline, and first impressions are not
  # recoverable.
  auto_stop_machines = false
  auto_start_machines = true
  # One machine, not two. Each runs its own background agent loop against a
  # single shared free-tier token budget, so a second machine does not add
  # availability here, it halves the tokens available to both and makes the
  # agent console non-deterministic about which machine's history you see.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  # The optimiser is CPU-bound for about ten seconds per cold search. A shared
  # single core turns that into a minute.
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
