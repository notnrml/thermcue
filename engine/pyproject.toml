[project]
name = "thermcue-engine"
version = "0.1.0"
description = "ThermCue core engine: FortyGuard thermal aggregation, queue simulation, heat-aware optimiser, and an autonomous replanning agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "simpy>=4.1.1",
    "ortools>=9.11",
    "numpy>=1.26",
    "pvlib>=0.11.0",
    "shapely>=2.0.0",
    "reportlab>=4.2.0",
    "ics>=0.7.2",
    "anthropic>=0.39.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thermcue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:thermcue.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
