# Fly.io deployment for the ThermCue engine.
#
# Region is chosen for latency to the judges rather than to the venue: the
# venue is a coordinate in a request body, the judges are the ones waiting for
# a page to paint.

app = "thermcue-engine"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  THERMCUE_CORS_ORIGINS = "*"

[http_service]
  internal_port = 8000
  force_https = true
  # Never scale to zero. A judge opening a cold link waits through a container
  # start plus a full thermal pipeline, and first impressions are not
  # recoverable.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  # The optimiser is CPU-bound for about ten seconds per cold search. A shared
  # single core turns that into a minute.
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
